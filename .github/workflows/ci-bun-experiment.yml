name: CI (bun experiment)

# Spike: mirrors the check/test jobs from ci.yml but using bun instead of
# pnpm, so their durations can be compared on real runners. Manual-only;
# not wired into required checks or triggered by push/PR. Delete once the
# pnpm-vs-bun decision is made.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Print version
        run: bun scripts/version.mjs
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-bun
          path: dist/
          retention-days: 1

  test-bun:
    needs: check-bun
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-bun
          path: dist/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Drop unrelated apt sources
        run: |
          files=$(grep -l -E 'packages\.microsoft\.com|dl\.google\.com' /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true)
          if [ -n "$files" ]; then
            sudo rm -f $files
          fi
      - run: bunx playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: bunx playwright test --shard=${{ matrix.shard }}/6
        env:
          CI: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report-bun-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
